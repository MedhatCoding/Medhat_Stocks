name: Daily EGX Telegram

on:
  schedule:
    # 09:00 Africa/Cairo, Sunday through Thursday.
    - cron: '0 9 * * 0-4'
      timezone: 'Africa/Cairo'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send now for testing even outside the normal Cairo time/session guard'
        required: false
        default: false
        type: boolean

concurrency:
  group: medhat-stocks-telegram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      OANOR_API_KEY: ${{ secrets.OANOR_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FORCE_TELEGRAM: ${{ inputs.force || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r api/requirements.txt

      - name: Validate Telegram configuration
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Missing TELEGRAM_BOT_TOKEN GitHub secret" && exit 1)
          test -n "$TELEGRAM_CHAT_ID" || (echo "Missing TELEGRAM_CHAT_ID GitHub secret" && exit 1)
          echo "Telegram secrets are configured."

      - name: Send daily EGX report
        run: |
          for attempt in 1 2 3; do
            echo "Telegram attempt $attempt/3"
            if python scripts/telegram_daily.py; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
            if [ "$attempt" -eq 3 ]; then
              echo "Telegram delivery failed after 3 attempts."
              exit 1
            fi
          done

      - name: Persist recommendation learning journal
        run: |
          if [ -f recommendation_journal.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recommendation_journal.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist recommendation outcomes"
              git push
            else
              echo "No new recommendation journal data."
            fi
          else
            echo "No journal file was produced."
          fi
