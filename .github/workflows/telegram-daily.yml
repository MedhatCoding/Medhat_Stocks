name: Daily EGX Telegram

on:
  schedule:
    - cron: '30 15 * * 0-4'
      timezone: 'Africa/Cairo'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send now for testing even outside the normal Cairo time/session guard'
        required: false
        default: false
        type: boolean

jobs:
  telegram:
    runs-on: ubuntu-latest
    env:
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      OANOR_API_KEY: ${{ secrets.OANOR_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FORCE_TELEGRAM: ${{ inputs.force || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Send daily EGX report
        run: python scripts/telegram_daily.py
