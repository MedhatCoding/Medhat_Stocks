name: Validate Streamlit app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Smoke import core modules
        run: |
          python - <<'PY'
          import data_engine
          import ml_engine
          import portfolio_advisor
          import recommendation_journal
          print("Core imports passed.")
          PY

      - name: Test neural-network training dimensions
        run: |
          python - <<'PY'
          import numpy as np
          from ml_engine import _fit_mlp
          rng = np.random.default_rng(7)
          X = rng.normal(size=(64, 9))
          y = (X[:, 0] + 0.4 * X[:, 1] > 0).astype(float)
          model = _fit_mlp(X, y, epochs=12)
          pred = model(X[:8])
          assert pred.shape == (8,), f"unexpected prediction shape: {pred.shape}"
          assert np.isfinite(pred).all(), "model returned non-finite predictions"
          assert ((pred >= 0) & (pred <= 1)).all(), "probabilities outside [0, 1]"
          print("Neural-network training/prediction test passed.")
          PY

      - name: Test symbol resolution and Sharia guard
        run: |
          python - <<'PY'
          from data_engine import data_engine
          from portfolio_advisor import advise

          assert data_engine.resolve_symbol("SWDY") == "SWDY"
          assert data_engine.resolve_symbol("SWDY.EGX") == "SWDY"
          assert data_engine.resolve_symbol("شركة السويدي إليكتريك") == "SWDY"

          advice = advise(
              {"symbol": "FAKE", "qty": 1, "avg": 10},
              analysis={"success": True},
              market={},
          )
          assert advice["action_key"] == "insufficient"
          assert "القائمة الشرعية" in advice["reason"]
          print("Symbol resolution and Sharia guard tests passed.")
          PY

      - name: Test stop-first handling for ambiguous daily candles
        run: |
          python - <<'PY'
          import recommendation_journal as journal

          original_read, original_write = journal._read, journal._write
          rows = [{
              "symbol": "SWDY", "date": "2026-01-01", "entry": 10,
              "target1": 11, "target2": 12, "stop": 9, "status": "open"
          }]
          saved = []
          journal._read = lambda: rows
          journal._write = lambda updated: saved.extend(updated)
          def history_loader(symbol, days=30):
              return {"success": True, "data": [{
                  "date": "2026-01-02", "open": 10, "high": 12,
                  "low": 8, "close": 10, "volume": 1000
              }]}
          try:
              journal.evaluate_open(history_loader, horizon=1)
              assert saved and saved[0]["outcome"] == "stop", saved
              print("Conservative stop-first test passed.")
          finally:
              journal._read, journal._write = original_read, original_write
          PY

      - name: Start Streamlit
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo
              echo "Streamlit health check passed."
              exit 0
            fi
            sleep 2
          done
          echo "Streamlit failed to start:"
          cat /tmp/streamlit.log
          exit 1
