name: EGX Walk-Forward Backtest

on:
  workflow_dispatch:
  schedule:
    # Monthly quality check; deliberately not daily to protect market-data quotas.
    - cron: '0 6 1 * *'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      OANOR_API_KEY: ${{ secrets.OANOR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run Sharia universe walk-forward test
        run: python scripts/backtest.py
      - name: Persist backtest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_report.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update walk-forward backtest report"
            git push
          else
            echo "No backtest changes."
          fi
