name: Check official Sharia universe source

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-check dependencies
        run: pip install requests pypdf
      - name: Fetch current official list and validate extraction
        run: python sharia_source_check.py
      - name: Upload source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharia-source-audit
          path: |
            artifacts/sharia_source_check.json
            artifacts/sharia_new_candidates_review.csv
            artifacts/sharia_reference_symbols_not_extracted.csv
          if-no-files-found: warn
          retention-days: 30
